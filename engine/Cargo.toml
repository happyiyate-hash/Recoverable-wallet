[package]
name = "wallet_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
ethers = { version = "2.0", features = ["wasm"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.38", features = ["rt", "macros", "time"] }
 tokio-tungstenite = "0.20"
