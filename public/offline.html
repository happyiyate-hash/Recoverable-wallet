<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wevina: Searching for Node...</title>
    <style>
        /* Base Wevina Dark Theme */
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Glassmorphic Container */
        .offline-container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            border: 1px solid rgba(139, 92, 246, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 320px;
            width: 90%;
        }

        /* Animated Offline Icon */
        .offline-icon-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 30px;
        }

        .main-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            filter: drop-shadow(0 0 15px rgba(139, 92, 246, 0.3));
        }

        /* The Animated Red Disconnect Pulse */
        .status-pulse {
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 20px;
            height: 20px;
            background-color: #EF4444;
            border-radius: 50%;
            border: 3px solid #000000;
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        h1 {
            font-size: 20px;
            font-weight: 900;
            margin: 0 0 12px 0;
            color: #FFFFFF;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin: 0 0 30px 0;
            line-height: 1.6;
            font-weight: 500;
        }

        .retry-button {
            background-color: #8B5CF6;
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.2);
        }

        .retry-button:hover {
            background-color: #7C3AED;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(139, 92, 246, 0.3);
        }

        .retry-button:active {
            transform: translateY(0);
        }

        .footer-tag {
            margin-top: 24px;
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.2em;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon-wrapper">
            <img src="/icons/icon-512.png" alt="Wevina Logo" class="main-icon">
            <div class="status-pulse"></div>
        </div>

        <h1>Offline Authority</h1>
        <p>The **Identity Node** is currently disconnected from the Registry. We are searching for a stable network node...</p>
        
        <button class="retry-button" onclick="window.location.reload();">Retry Registry Node</button>
        
        <div class="footer-tag">Protocol Sentinel v2.1</div>
    </div>

    <script>
        // Automatic reconnection handshake
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
